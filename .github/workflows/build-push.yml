name: Build and Push Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ocir.ap-mumbai-1.oci.oraclecloud.com
  NAMESPACE: bmnhzxm9xanv
  IMAGE_PREFIX: miniauth

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push authorization-server
        run: |
          IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_PREFIX/authorization-server:${{ steps.vars.outputs.TAG }}"
          docker build -f AuthorizationServer/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push user-service
        run: |
          IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_PREFIX/user-service:${{ steps.vars.outputs.TAG }}"
          docker build -f UserService/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push resource-server
        run: |
          IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_PREFIX/resource-server:${{ steps.vars.outputs.TAG }}"
          docker build -f ResourceServer/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push client-service
        run: |
          IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_PREFIX/client-service:${{ steps.vars.outputs.TAG }}"
          docker build -f ClientService/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get GitHub OIDC token
        id: oidc
        run: |
          AUDIENCE="oke-kubernetes-cluster"

          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Debug OIDC claims
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import json

          token = os.environ["TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Test OKE access
        run: |
          kubectl \
            --server="https://80.225.251.98:6443" \
            --token="${{ steps.oidc.outputs.token }}" \
            --insecure-skip-tls-verify \
            get pods -n miniauth