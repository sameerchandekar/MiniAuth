services:
  authorization-server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: AuthorizationServer/Dockerfile
    container_name: miniauth-authorization-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - AuthorizationServer/.env

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: miniauth-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - UserService/.env

  resource-server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ResourceServer/Dockerfile
    container_name: miniauth-resource-server
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ResourceServer/.env
    environment:
      - JWKS_URL=http://authorization-server:8080/.well-known/jwks.json
      - ISSUER_URL=http://localhost:8080

  client-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ClientService/Dockerfile
    container_name: miniauth-client-service
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ClientService/.env
    environment:
      - AUTH_SERVER_URL=http://localhost:8080
      - AUTH_SERVER_INTERNAL_URL=http://authorization-server:8080